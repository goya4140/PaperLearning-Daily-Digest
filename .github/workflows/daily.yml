name: Daily Paper Discovery

on:
  schedule:
    - cron: "0 5 * * *" # 13:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      date:
        description: "Digest date (YYYY-MM-DD); arXiv query lag comes from config"
        required: false
        type: string
      dry_run:
        description: "Render without sending email"
        required: true
        default: true
        type: boolean
      reuse_archive:
        description: "Redeliver the sealed archived digest without refetching sources"
        required: true
        default: false
        type: boolean

concurrency:
  group: daily-paper-discovery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install pinned XHS fetcher and signing runtime
        run: |
          git clone https://github.com/yzbcs/Daily-Digest-Assistant.git vendor/daily-digest-assistant
          git -C vendor/daily-digest-assistant checkout 4957c3e40354816edbb2114e3aad7a3b53be47d4
          npm ci --prefix vendor/daily-digest-assistant
      - name: Install pinned Zhihu signing runtime
        run: |
          git init vendor/mediacrawler
          git -C vendor/mediacrawler remote add origin https://github.com/NanmiCoder/MediaCrawler.git
          git -C vendor/mediacrawler sparse-checkout set --no-cone libs/zhihu.js
          git -C vendor/mediacrawler fetch --depth 1 origin 0625e01a6bc717a3fc9c96d3dac7fb8957043838
          git -C vendor/mediacrawler checkout FETCH_HEAD
      - name: Build and optionally send digest
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
          ZHIHU_COOKIE: ${{ secrets.ZHIHU_COOKIE }}
          X_COOKIE: ${{ secrets.X_COOKIE }}
          ARXIV_CONTACT_EMAIL: ${{ vars.ARXIV_CONTACT_EMAIL }}
          PYTHONPATH: src:vendor/daily-digest-assistant
        run: |
          args=()
          if [ -n "${{ inputs.date }}" ]; then args+=(--date "${{ inputs.date }}"); fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.reuse_archive }}" = "true" ]; then args+=(--reuse-archive); fi
          if [ -z "$EMAIL_USER" ] || [ -z "$EMAIL_PASS" ] || [ -z "$EMAIL_TO" ]; then
            echo "Email secrets are incomplete; falling back to dry-run."
            args+=(--dry-run)
          fi
          python -m paper_digest.main "${args[@]}"
      - name: Upload digest artifacts
        uses: actions/upload-artifact@v7
        with:
          name: paper-digest-${{ github.run_id }}
          path: |
            preview.html
            out/email.html
            out/shortlist.json
            out/delivery.json
      - name: Archive sync data and HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/daily/ docs/data/
          if ! git diff --cached --quiet; then
            git commit -m "archive daily digest"
            git push
          fi
