[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperlearning-daily-digest"
version = "0.1.0"
description = "Two-lane paper discovery and email delivery for PaperLearning Vault"
requires-python = ">=3.11"
dependencies = [
  "Jinja2==3.1.6",
  "loguru==0.7.3",
  "openai==1.93.0",
  "PyExecJS==1.5.1",
  "PyYAML==6.0.2",
  "requests==2.32.4",
  "twikit @ git+https://github.com/sakenuGOD/twikit.git@e9b5acf140492fb642b2e5322a9ad55ee10415bc",
]

[project.scripts]
paper-digest = "paper_digest.main:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
