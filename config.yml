version: 1
timezone: Asia/Shanghai

arxiv:
  api_url: https://export.arxiv.org/api/query
  rss_url: https://arxiv.org/rss
  rss_fallback: true
  categories: [cs.CL, cs.LG, cs.CV, cs.AI]
  page_size: 1000
  request_interval_seconds: 3.1
  # Beijing-time digest day normally corresponds to the preceding UTC submission day.
  submission_lag_days: 1
  reuse_latest_on_non_announcement_days: true
  # Optional. ARXIV_CONTACT_EMAIL overrides this value in CI/local runs.
  contact_email: ""

selection:
  # Deterministic selection happens before the single batched LLM request.
  deterministic_pool_per_lane: 30
  llm_candidate_limit: 36
  focus_count: 4
  explore_count: 4
  diversity_penalty: 0.45

  # A profile describes a research intent, not a required literal keyword.
  # Add related phrases freely; the exploration lane never depends on these.
  focus_profiles:
    - id: affective-reasoning
      label: Affective Reasoning
      categories: [cs.AI, cs.CL, cs.CV, cs.HC, cs.MA]
      concepts:
        - [affective reasoning, emotion reasoning, emotion cause]
        - [theory of mind, social reasoning, mental state reasoning]
        - [multimodal emotion, emotion understanding]
    - id: agent-capabilities
      label: Agent Capabilities and Skills
      categories: [cs.AI, cs.CL, cs.LG, cs.RO, cs.MA]
      concepts:
        - [agent skill, skill library, skill discovery, skill evolution]
        - [tool learning, tool use, agent memory, agent planning]
        - [multi-agent, agentic system, autonomous agent]
    - id: reward-and-evaluation
      label: Reward, Verification and Evaluation
      categories: [cs.AI, cs.CL, cs.LG]
      concepts:
        - [reward model, process reward, preference learning]
        - [verifier model, llm-as-judge, rubric evaluation]
        - [reward hacking, alignment evaluation]

llm:
  enabled: true
  model: qwen-plus
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  temperature: 0.1

xhs:
  enabled: true
  # Focus + exploration queries. XHS search uses OR across separate requests.
  keywords:
    - AI Agent
    - 智能体实践
    - AI论文
    - 开源AI
    - 多模态AI
    - AI研究趋势
  candidate_pool: 24
  max_items: 5
  min_score: 6

bilibili:
  enabled: true
  # BILIBILI_COOKIE is required. Missing credentials skip this channel safely.
  keywords:
    - AI 访谈
    - 大模型 产品实测
    - AI Agent 实战
    - 人工智能 技术演讲
    - AI 会议录播
    - 论文解读 大模型
  candidate_pool: 30
  detail_pool: 12
  max_items: 5
  min_score: 65
  max_age_days: 30
  min_duration_seconds: 180
  max_per_author: 1
  max_per_content_type: 2
  blocked_terms: [招生, 训练营, 付费群, 加微信, 课程优惠, 接广告, 纯搬运]
  request_interval_seconds: 1.2

zhihu:
  enabled: true
  # ZHIHU_COOKIE is required and must include d_c0. Missing credentials skip this channel safely.
  keywords:
    - 大厂 面试 经验
    - 算法工程师 面经 复盘
    - 大模型 岗位 面试
    - AI 科研 方向 选择
    - 读博 科研 经验
    - 机器学习 原理 解读
    - AI Agent 知识 解读
    - 论文 阅读 研究方法
  candidate_pool: 32
  detail_pool: 16
  max_items: 5
  min_score: 65
  max_age_days: 730
  min_content_chars: 120
  max_per_author: 1
  max_per_content_type: 2
  blocked_terms: [加微信, 私信领取, 训练营, 付费咨询, 课程优惠, 求职辅导, 保 offer, 招生, 软广, 多平台整理, 全网整理, 来源覆盖多个平台]
  search_time: a_year
  request_interval_seconds: 1.5

delivery:
  subject_prefix: "PaperLearning 每日发现"
  smtp_provider: "auto"
  send_empty_digest: true
